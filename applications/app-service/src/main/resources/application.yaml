server:
  port: 8080
spring:
  application:
    name: "authentication-sv"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

logging:
  level:
    co.com.powerup.ags.authentication: DEBUG
    org.springframework.web: DEBUG
    reactor.netty: INFO

adapters:
  r2dbc:
    host: "${DB_HOST:localhost}"
    port: ${DB_PORT:3306}
    database: "${DB_DATABASE:authenticacion_db}"
    schema: "${DB_SCHEMA:public}"
    username: "${DB_USERNAME:authuser}"
    password: "${DB_PASSWORD:authpassword}"

security:
  jwt:
    secret: "${JWT_SECRET:bXlTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}"
    expiration: "${JWT_EXPIRATION:3600}"
